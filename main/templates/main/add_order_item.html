<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Order Item</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-header bg-success text-white text-center">
            <h4>Create Order Item</h4>
          </div>
          <div class="card-body">
            <form method="post">
              {% csrf_token %}
              
              <!-- Food Item Selection -->
              <div class="mb-3">
                <label for="fooditem" class="form-label fw-bold">Select Food Item</label>
                <select class="form-select" id="fooditem" name="fooditem">
                  <option value="" selected disabled>-- Choose an item --</option>
                  {% for item in fooditems %}
                    <option value="{{ item.id }}">{{ item.name }} (KES {{ item.discounted_price }})</option>
                  {% endfor %}
                </select>
              </div>

              <!-- Quantity -->
              <div class="mb-3">
                <label for="quantity" class="form-label fw-bold">Quantity</label>
                <input type="number" class="form-control" id="quantity" step="1" name="quantity" min="1" required>
              </div>

              <!-- Submit Button -->
              <div class="d-grid">
                <button type="submit" class="btn btn-success btn-lg">Add to Order</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
