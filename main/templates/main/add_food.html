<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <div class="bg-light row justify-content-center" style="height: 100vh;">
        <div class="align-items-ceter col-md-4">
            <div class="card shadow-sm mt-5">
                <h1 class="text-success text-center pt-3 fw-bold">Add food item</h1>
                <hr>
                <small class="text-center py-3">Add food items to your FoodSaver inventory and help reduce waste.</small>
                <form action="{% url 'add_food' %}" method="POST" class="row g-3 p-3" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="col-md-6 py-2">
                        <label for="name" class="fw-bold">Name</label>
                        <input id="name" type="text" class="form-control" name="name">
                    </div>
                    <div class="col-md-6 py-2">
                        <label for="expiry_date" class="fw-bold">Expiry Date</label>
                        <input id="expiry_date" type="date" name="expiry_date" class="form-control">
                    </div>
                    <div class="col-md-6 py-2">
                        <label for="original_price" class="fw-bold">Original Price</label>
                        <input id="original_price" type="number" min="0.00" name="original_price" class="form-control">
                    </div>
                    <div class="col-md-6 py-2">
                        <label for="discounted_price" class="fw-bold">Discounted Price</label>
                        <input id="discounted_price" type="number" step="0.01" min="0.00" name="discounted_price" class="form-control">
                    </div>
                    <div class="col-md-8 py-2">
                        <label for="stock" class="fw-bold">Stock</label>
                        <input id="stock" type="number" min="0" step="1" name="stock" class="form-control">
                    </div>
                    <div class="col-md-12 py-2">
                        <label for="image" class="fw-bold">Image</label>
                        <input id="image" type="file" name="image" accept="image/*">
                    </div>
                    <div class="d-flex justify-content-between px-5 pb-3 pt-2">
                        <div><button type="submit" class="btn btn-lg px-5 btn-success">+ Add</button></div>
                        <div><a class="btn btn-lg px-5 btn-success" href="{%url 'donor_dashboard'%}">Cancel</a></div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
