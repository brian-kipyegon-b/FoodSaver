<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <style>
        .sms-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sms-bubble {
            max-width: 70%;
            padding: 10px;
            border-radius: 15px;
            background-color: #e5e5ea;
            position: relative;
        }

        .sms-bubble.unread {
            background-color: #d1f7c4;
            /* highlight unread */
        }

        .sms-time {
            font-size: 0.8em;
            color: gray;
            text-align: right;
        }
    </style>
</head>

<body>

    <div class="container mt-4">
        <div class="d-flex justify-content-between px-4 align-items-center">
            <div>
                <h3 class="mb-4 text-success fw-bold">
                    Notifications
                </h3>
            </div>
            <div>
                <a class="btn btn-sm btn-outline-secondary px-3" href="{% url 'donor_dashboard' %}">
                    &larr; Back
                </a>
            </div>
        </div>

        <div class="sms-container">
            {% for note in notes %}
            <div class="sms-bubble {% if not note.is_read %} unread {% endif %}">
                <strong>{{ note.type|title }}</strong><br>
                {{ note.message }}
                <div class="sms-time">{{ note.created_at|date:"M d, Y H:i" }}</div>
            </div>
            {% empty %}
            <div class="col-md-8 rounded-3 p-5 text-center bg-light">
                <p>No notifications yet.</p>
            </div>
            {% endfor %}
        </div>
    </div>

    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
