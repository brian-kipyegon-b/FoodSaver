<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order_details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    
<div class="container mt-5">
  <h2 class="mb-4 text-center">Order #{{ order.id }}</h2>
  <p><strong>Placed on:</strong> {{ order.created_at }}</p>

  <div class="table-responsive">
    <table class="table table-striped align-middle">
      <thead class="table-dark">
        <tr>
          <th scope="col">Item</th>
          <th scope="col">Quantity</th>
          <th scope="col">Price (KES)</th>
          <th scope="col">Subtotal (KES)</th>
        </tr>
      </thead>
      <tbody>
        {% for item in items %}
        <tr>
          <td>{{ item.fooditem.name }}</td>
          <td>{{ item.quantity }}</td>
          <td>{{ item.fooditem.discounted_price }}</td>
          <td>{{ item.subtotal }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <h4 class="mt-4">Total Price: <span class="text-success">KES {{ order.total_price }}</span></h4>

  <a href="{% url 'consumer_dashboard' %}" class="btn btn-outline-primary mt-3">
    <i class="bi bi-arrow-left-circle"></i> Back to Dashboard
  </a>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
