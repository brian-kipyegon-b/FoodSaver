<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <div style="background: rgba(0, 0, 0, 0.06); height: 100vh;" class="py-5">
        <div class="row justify-content-center py-5">
            <div class="col-md-3">
                <div class="card shadow-sm p-3">
                    <h1 class="p-3 fs-3">Log in to Food<span class="text-success">Saver</span></h1>
                    <form class="p-3" action="{% url 'login' %}" method="POST">
                        {% csrf_token %}
                        <div class="col-md-12 py-3">
                            <label class="fw-bold" for="username">Username</label>
                            <input type="text" name="username" class="form-control">
                        </div>
                        <div class="col-md-12 py-3">
                            <label class="fw-bold" for="password">Password</label>
                            <input type="password" name="password" class="form-control">
                        </div>
                        <div class=" py-3">
                            <button type="submit" class="btn btn-success btn-lg">Submit</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
