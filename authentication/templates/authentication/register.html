<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register FoodManagement</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div style="background: rgba(0, 0, 0, 0.06); height: 100vh;">
    <div class="row pt-5 justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm">
                <h1 class="fw-bold text-center pt-5">Create a Food<span class="text-success">Saver</span> account</h1>
                <form action="{% url 'register' %}" method="POST" class="row g-3 p-5">
                    {% csrf_token %}
                    <div class="col-md-6">
                        <label for="first_name" class="fw-bold">First Name</label>
                        <input type="text" name="first_name" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label for="last_name" class="fw-bold">Last Name</label>
                        <input type="text" name="last_name" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label for="username" class="fw-bold">Username</label>
                        <input type="text" name="username" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label for="inputEmail4" class="form-label fw-bold">Email</label>
                        <input type="email" class="form-control" name="email">
                    </div>
                    <div class="col-md-6"> 
                        <label for="inputPassword4" class="form-label fw-bold">Password</label>
                        <input type="password" class="form-control" name="password">
                    </div>
                    <div class="col-md-6">
                        <label for="confirm_password" class="fw-bold">Confirm Password</label>
                        <input type="password" class="form-control" name="confirm_password">
                    </div>
                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-success">Submit</button>
                        <a href="{% url 'login' %}" class="btn btn-link">Already have an account? Log in</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
